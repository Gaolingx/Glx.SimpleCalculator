[workspace]
members = ["crates/calc-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
calc-core = { path = "crates/calc-core" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rust_decimal = { version = "1", features = ["maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2" }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
quick-xml = "0.38"
winreg = "0.55"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
